version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      angular-framework:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
        update-types:
          - patch
      ionic-runtime:
        patterns:
          - "@ionic/*"
          - "ionicons"
        update-types:
          - patch
      capacitor-runtime:
        patterns:
          - "@capacitor/*"
        update-types:
          - patch
      development-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "@capacitor/*"
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

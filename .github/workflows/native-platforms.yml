name: Senatla Ops native platform gates

on:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".browserslistrc"
      - ".npmrc"
      - "angular.json"
      - "ionic.config.json"
      - "tsconfig*.json"
      - "scripts/normalize-capacitor-spm-paths.mjs"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/native-platforms.yml"
  push:
    branches: [dev]
    paths:
      - "android/**"
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".browserslistrc"
      - ".npmrc"
      - "angular.json"
      - "ionic.config.json"
      - "tsconfig*.json"
      - "scripts/normalize-capacitor-spm-paths.mjs"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/native-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senatla-ops-native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENATLA_API_MODE: local
  SENATLA_AUTH_REVIEW_BYPASS: "false"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npm run native:sync:android
      - name: Prepare stable dev signing material
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          KEYSTORE_B64: ${{ secrets.SENATLA_UAT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SENATLA_UAT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SENATLA_UAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SENATLA_UAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "SENATLA_UAT_KEYSTORE_B64 is required for upgradeable dev APKs." >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "SENATLA_UAT_STORE_PASSWORD is required." >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "SENATLA_UAT_KEY_ALIAS is required." >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "SENATLA_UAT_KEY_PASSWORD is required." >&2; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/senatla-uat.jks"
          chmod 600 "$RUNNER_TEMP/senatla-uat.jks"
      - name: Build Android debug package
        working-directory: android
        env:
          SENATLA_VERSION_CODE: ${{ github.run_number }}
          SENATLA_UAT_STORE_FILE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && format('{0}/senatla-uat.jks', runner.temp) || '' }}
          SENATLA_UAT_STORE_PASSWORD: ${{ secrets.SENATLA_UAT_STORE_PASSWORD }}
          SENATLA_UAT_KEY_ALIAS: ${{ secrets.SENATLA_UAT_KEY_ALIAS }}
          SENATLA_UAT_KEY_PASSWORD: ${{ secrets.SENATLA_UAT_KEY_PASSWORD }}
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Prepare dev APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/senatla-ops-dev.apk
      - name: Upload dev APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: senatla-ops-dev-apk
          path: android/app/build/outputs/apk/debug/senatla-ops-dev.apk
          if-no-files-found: error
          retention-days: 7

  publish-dev-apk:
    needs: android-debug
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: senatla-ops-dev-apk
          path: artifacts
      - name: Publish current dev APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Senatla Ops dev APK
          prerelease: true
          make_latest: false
          body: Stable-signed Android dev build for UAT. Future dev APKs use the same signing identity and a monotonically increasing version code so testers can upgrade in place.
          files: artifacts/senatla-ops-dev.apk
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run native:sync:ios
      - name: Build unsigned iOS simulator application
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

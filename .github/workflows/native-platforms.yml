name: Senatla Ops native platform gates

on:
  pull_request:
  push:
    branches: [dev]
    paths:
      - "android/**"
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - ".browserslistrc"
      - ".npmrc"
      - "angular.json"
      - "ionic.config.json"
      - "tsconfig*.json"
      - "scripts/normalize-capacitor-spm-paths.mjs"
      - "scripts/write-runtime-config.mjs"
      - ".github/workflows/native-platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senatla-ops-native-${{ github.ref }}
  cancel-in-progress: true

env:
  SENATLA_API_MODE: local
  SENATLA_AUTH_REVIEW_BYPASS: "false"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Detect native-impacting changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          if grep -Eq '^(android/|ios/|src/|package(-lock)?\.json$|capacitor\.config\.ts$|\.browserslistrc$|\.npmrc$|angular\.json$|ionic\.config\.json$|tsconfig.*\.json$|scripts/(normalize-capacitor-spm-paths|write-runtime-config)\.mjs$|\.github/workflows/native-platforms\.yml$)' <<< "$changed_files"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  android-debug:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npm run native:sync:android
      - name: Build unsigned Android debug package
        working-directory: android
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Prepare dev APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/senatla-ops-dev.apk
      - name: Upload dev APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: senatla-ops-dev-apk
          path: android/app/build/outputs/apk/debug/senatla-ops-dev.apk
          if-no-files-found: error
          retention-days: 7

  publish-dev-apk:
    needs: [changes, android-debug]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: senatla-ops-dev-apk
          path: artifacts
      - name: Publish current dev APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Senatla Ops dev APK
          prerelease: true
          make_latest: false
          body: Unsigned Android debug build for the current dev deployment. Install only for UAT testing.
          files: artifacts/senatla-ops-dev.apk
  ios-simulator:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run native:sync:ios
      - name: Build unsigned iOS simulator application
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  native-required:
    needs: [changes, android-debug, ios-simulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the native gate result
        env:
          NATIVE_CHANGED: ${{ needs.changes.outputs.native }}
          ANDROID_RESULT: ${{ needs.android-debug.result }}
          IOS_RESULT: ${{ needs.ios-simulator.result }}
        run: |
          if [ "$NATIVE_CHANGED" != "true" ]; then
            echo "Native build is not applicable to this change."
            exit 0
          fi

          if [ "$ANDROID_RESULT" = "success" ] && [ "$IOS_RESULT" = "success" ]; then
            echo "Android and iOS native gates passed."
            exit 0
          fi

          echo "Native gate failed: android=$ANDROID_RESULT ios=$IOS_RESULT" >&2
          exit 1

name: Senatla Ops hosted deployment smoke

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact Vercel deployment URL to verify
        required: true
        type: string
      expected_commit:
        description: Full reviewed Git commit SHA
        required: true
        type: string
      environment:
        description: Vercel environment recorded in runtime config
        required: true
        type: choice
        options: [preview, production]
      rollback_commit:
        description: Reviewed rollback commit SHA
        required: true
        type: string
      responsible_owner:
        description: Person responsible for release and rollback
        required: true
        type: string

permissions:
  contents: read

jobs:
  hosted-smoke:
    runs-on: ubuntu-26.04
    environment: Preview
    steps:
      - uses: actions/checkout@v7
      - name: Check protected deployment access and public runtime
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$BYPASS_SECRET" || { echo "Canonical project automation bypass secret is required for protected preview smoke." >&2; exit 1; }
          body=$(mktemp)
          status=$(curl --silent --show-error --location --cookie "" --max-time 20 \
            --header "x-vercel-protection-bypass: $BYPASS_SECRET" \
            --output "$body" --write-out '%{http_code}' \
            "${DEPLOYMENT_URL%/}/assets/runtime-config.json")
          if [ "$status" != 200 ] || ! jq -e '.api.mode == "supabase" and (.api.supabaseUrl | length > 0) and (.api.supabaseAnonKey | length > 0)' "$body" >/dev/null 2>&1; then
            echo "Protected runtime preflight failed (HTTP $status). Check the bypass secret for the exact Vercel project and deployment; no application content or secret was logged." >&2
            exit 1
          fi
          echo "Protected preview runtime preflight passed."
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate protected QA inputs
        env:
          QA_EMAIL: ${{ secrets.SENATLA_QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.SENATLA_QA_PASSWORD }}
        run: |
          test -n "$QA_EMAIL" || { echo "SENATLA_QA_EMAIL is required in Preview." >&2; exit 1; }
          test -n "$QA_PASSWORD" || { echo "SENATLA_QA_PASSWORD is required in Preview." >&2; exit 1; }
      - id: smoke
        name: Run protected hosted smoke
        continue-on-error: true
        run: npm run test:hosted
        env:
          CI: true
          SENATLA_HOSTED_URL: ${{ inputs.deployment_url }}
          SENATLA_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SENATLA_EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
          SENATLA_HOSTED_QA_EMAIL: ${{ secrets.SENATLA_QA_EMAIL }}
          SENATLA_HOSTED_QA_PASSWORD: ${{ secrets.SENATLA_QA_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Write sanitized deployment evidence
        if: always()
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          ROLLBACK_COMMIT: ${{ inputs.rollback_commit }}
          RESPONSIBLE_OWNER: ${{ inputs.responsible_owner }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p output/deployment-evidence
          jq -n \
            --arg deploymentUrl "$DEPLOYMENT_URL" \
            --arg environment "$DEPLOYMENT_ENVIRONMENT" \
            --arg expectedCommit "$EXPECTED_COMMIT" \
            --arg rollbackCommit "$ROLLBACK_COMMIT" \
            --arg responsibleOwner "$RESPONSIBLE_OWNER" \
            --arg result "$SMOKE_RESULT" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{deploymentUrl:$deploymentUrl,environment:$environment,expectedCommit:$expectedCommit,rollbackCommit:$rollbackCommit,responsibleOwner:$responsibleOwner,result:$result,verifiedAt:$verifiedAt}' \
            > output/deployment-evidence/hosted-smoke.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-deployment-evidence
          path: |
            output/deployment-evidence
            output/playwright/hosted-results
          if-no-files-found: error
          retention-days: 30
      - name: Enforce smoke result
        if: steps.smoke.outcome != 'success'
        run: exit 1

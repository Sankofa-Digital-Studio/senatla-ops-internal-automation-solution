name: Sankofa ERP Security & Vulnerability Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Run every Monday at 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'package*.json'
      - '.github/workflows/security-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Run npm dependency audit
        run: npm audit --audit-level=high
      - name: Verify zero uncommitted vulnerability overrides
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "Working tree is dirty after clean install." >&2
            exit 1
          }

<div class="min-h-dvh w-full flex flex-col font-sans text-slate-900 bg-slate-50 overflow-x-clip relative">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-lime-300 focus:text-slate-950 focus:font-bold focus:rounded-lg focus:shadow-xl">
    Skip to main content
  </a>

  <div *ngIf="isOffline()" role="status" aria-live="polite" class="bg-amber-950/90 text-amber-200 border-b border-amber-600/40 px-4 py-2 text-xs text-center font-bold">
    <span>Offline mode: Network connection unavailable. Changes will sync when connectivity returns.</span>
  </div>

  <app-time-controls *ngIf="showDebugControls && !isPublicRoute()"></app-time-controls>

  <header *ngIf="auth.isAuthenticated() && !isPublicRoute()" class="bg-slate-950 text-white px-4 py-3 flex flex-col md:flex-row justify-between md:items-center gap-3 text-xs z-50 border-b border-slate-800">
    <a routerLink="/landing" class="inline-flex min-h-11 items-center font-bold text-yellow-500 uppercase tracking-[0.2em]">Senatla Ops</a>
    <nav class="flex items-center gap-2 flex-wrap" aria-label="Account navigation">
      <span class="text-slate-300">Signed in as {{ auth.displayName() }}</span>
      <a [routerLink]="workspaceLink().path" class="px-3 py-2 rounded border border-slate-700 text-slate-200 hover:border-slate-500 transition-colors">{{ workspaceLink().label }}</a>
      <a routerLink="/profile-settings" class="px-3 py-2 rounded border border-slate-700 text-slate-200 hover:border-slate-500 transition-colors">Profile</a>
      <button type="button" (click)="logout()" class="px-3 py-2 rounded border border-red-900 text-red-300 hover:bg-red-950 transition-colors">Sign out</button>
    </nav>
  </header>

  <nav *ngIf="auth.isAuthenticated() && !isPublicRoute()" class="bg-slate-900 border-b border-slate-800 px-4 py-2 text-xs text-slate-300 flex items-center justify-between gap-3 flex-wrap" aria-label="Breadcrumb">
    <ol class="flex items-center gap-1.5 flex-wrap">
      <li *ngFor="let crumb of breadcrumbs(); let last = last" class="flex items-center gap-1.5">
        <a *ngIf="!last && crumb.path" [routerLink]="crumb.path" class="text-lime-300 hover:text-lime-200 font-medium transition-colors">{{ crumb.label }}</a>
        <span *ngIf="last" class="text-white font-bold" aria-current="page">{{ crumb.label }}</span>
        <span *ngIf="!last" class="text-slate-500" aria-hidden="true">&rsaquo;</span>
      </li>
    </ol>
    <a *ngIf="isDeepRoute()" [routerLink]="workspaceLink().path" class="inline-flex items-center gap-1 text-lime-300 hover:text-lime-200 font-semibold transition-colors">
      <span aria-hidden="true">&larr;</span> Back to {{ workspaceLink().label }}
    </a>
  </nav>

  <main id="main-content" class="flex-1 relative min-h-0 overflow-x-clip" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
